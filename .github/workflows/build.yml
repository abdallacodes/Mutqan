# ==============================================================================
# Mutqan Build & Test CI/CD Workflow
# ==============================================================================
# Pushing a tag like v1.0.1 (release.py does this) builds two things from one source:
#   - the "direct" APK (with the in-app updater), attached to a GitHub Release;
#   - the "play" app bundle (.aab, no updater, no permission to install packages), kept as a build artifact to
#     upload to Google Play. It is signed with the same key, which Play takes as the upload key.
#
# Keystore Persistence Setup Instructions:
# To prevent "App not installed" update failures caused by signature mismatches,
# every release must be signed with the same key. Follow these 3 steps ONCE:
#
# Step 1: Generate a release keystore locally on your developer machine:
#   keytool -genkeypair -v -keystore release.keystore -alias mutqanreleasekey \
#     -keyalg RSA -keysize 2048 -validity 10000
#
# Step 2: Encode the keystore to Base64 format:
#   - Linux/macOS:
#       base64 -w 0 release.keystore > keystore_base64.txt
#   - Windows PowerShell:
#       [Convert]::ToBase64String([IO.File]::ReadAllBytes("release.keystore")) > keystore_base64.txt
#
# Step 3: Add the following Repository Secrets in GitHub:
#   GitHub Repo -> Settings -> Secrets and variables -> Actions -> New repository secret:
#     - RELEASE_KEYSTORE_BASE64   : Paste content of keystore_base64.txt
#     - RELEASE_KEYSTORE_PASSWORD : the password you chose
#     - RELEASE_KEY_ALIAS         : mutqanreleasekey
#     - RELEASE_KEY_PASSWORD      : the same password again (a PKCS12 keystore, which is
#                                   what keytool creates, has one password for both)
#
# Keep release.keystore somewhere safe and out of the repository (*.keystore is
# git-ignored): losing it means future updates cannot be installed over old ones.
# Without the secrets the APK is still built, but signed with the debug key.
#
# Accounts and sync (optional): add a repository secret GOOGLE_SERVICES_JSON holding the whole
# content of the Firebase project's google-services.json (see firebase/README.md).
# ==============================================================================

name: Build & Test Mutqan

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Add Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # Optional: without the secret the app still builds, but accounts and sync are hidden.
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/release.keystore
            echo "✅ Persistent release keystore successfully unpacked."
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not set; refusing to publish a release signed with the debug key."
            exit 1
          else
            echo "⚠️ RELEASE_KEYSTORE_BASE64 secret is not set."
            echo "   Upload a persistent keystore to GitHub Secrets to get identical APK signatures across builds."
          fi

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew :app:testDirectDebugUnitTest :app:testPlayDebugUnitTest :quran:testDebugUnitTest --stacktrace

      - name: Build Release APK and Play bundle
        env:
          KEYSTORE_FILE: /home/runner/.android/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDirectRelease :app:bundlePlayRelease --stacktrace

      # Google Play does not let an app update itself any way but through Play, and asks for a declaration for the
      # permission to install packages. The play build must never carry it, nor the provider that goes with it.
      - name: Check the Play build has no updater
        run: |
          MANIFEST=$(find app/build/intermediates/merged_manifest/playRelease -name AndroidManifest.xml | head -1)
          if [[ -z "$MANIFEST" ]]; then
            echo "::error::The merged manifest of the play build was not found."
            exit 1
          fi
          if grep -q "REQUEST_INSTALL_PACKAGES\|androidx.core.content.FileProvider" "$MANIFEST"; then
            echo "::error::The play build asks to install packages or carries the updater's provider."
            exit 1
          fi
          grep -q 'package="com.mutqan.quran"' "$MANIFEST" || { echo "::error::The play build has another package name."; exit 1; }

      - name: Verify APK Signature
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/direct/release/app-direct-release.apk | tee signer.txt
          if grep -q "CN=Android Debug" signer.txt; then
            echo "::warning::The APK is signed with the debug key, not the release key."
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::Refusing to publish a debug-signed release."
              exit 1
            fi
          fi

      - name: Verify bundle signature
        run: |
          AAB=app/build/outputs/bundle/playRelease/app-play-release.aab
          keytool -printcert -jarfile "$AAB" | tee bundle-signer.txt
          if grep -q "CN=Android Debug" bundle-signer.txt; then
            echo "::warning::The bundle is signed with the debug key, not the release key."
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::Refusing to publish a debug-signed bundle."
              exit 1
            fi
          fi

      # The files carry the app's name and version (Mutqan-6.5.5.apk), so downloads from different releases do not
      # pile up as app-release (1).apk and say what they are. The in-app updater takes the release's .apk whatever it is called.
      - name: Name the APK and the bundle
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [[ -z "$VERSION" ]]; then
            echo "::error::versionName was not found in app/build.gradle.kts."
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match versionName $VERSION in app/build.gradle.kts."
            exit 1
          fi
          NAME="Mutqan-$VERSION.apk"
          cp app/build/outputs/apk/direct/release/app-direct-release.apk "app/build/outputs/apk/direct/release/$NAME"
          echo "path=app/build/outputs/apk/direct/release/$NAME" >> "$GITHUB_OUTPUT"
          BUNDLE="Mutqan-$VERSION.aab"
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "app/build/outputs/bundle/playRelease/$BUNDLE"
          echo "bundle=app/build/outputs/bundle/playRelease/$BUNDLE" >> "$GITHUB_OUTPUT"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mutqan-Release-APK
          path: ${{ steps.apk.outputs.path }}

      - name: Upload Play Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mutqan-Play-Bundle
          path: ${{ steps.apk.outputs.bundle }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          name: Mutqan ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
